<!-- Neutral mark for the reference build: a handset with a trade in arrow.
     Says "phone shop" without naming anyone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0C1524"/>

  <!-- handset -->
  <rect x="20" y="13" width="24" height="38" rx="5"
        fill="none" stroke="#fff" stroke-width="3.2"/>
  <!-- screen tint -->
  <rect x="24" y="19" width="16" height="20" rx="2" fill="#1D4ED8"/>
  <!-- speaker slot -->
  <rect x="28.5" y="15.6" width="7" height="1.8" rx=".9" fill="#fff" opacity=".85"/>
  <!-- home indicator -->
  <rect x="27.5" y="44.5" width="9" height="2.4" rx="1.2" fill="#fff" opacity=".85"/>

  <!-- exchange arrows, the trade in idea -->
  <g stroke="#7FA5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9 26h7"/>
    <path d="M13 22l4 4-4 4"/>
    <path d="M55 38h-7"/>
    <path d="M51 42l-4-4 4-4"/>
  </g>
</svg>
